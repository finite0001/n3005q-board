; M5Stack M5Paper Color (PaperColor) -- ESP32-S3R8, 16MB flash, 8MB OPI PSRAM.
; Board/partition values are from M5Stack's own PaperColor documentation.
; The sketch lives in n3005q_board/, not the default src/.
[platformio]
src_dir = n3005q_board

[env:m5stack-papercolor]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; The default RTS "hard_reset" leaves this board sitting in the ROM bootloader
; after upload over native USB-Serial/JTAG, so the new firmware never runs.
; A watchdog reset boots the app.
board_upload.after_reset = watchdog_reset
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; Pulls the Mozilla root bundle into the image for TLS verification.
    -DCONFIG_MBEDTLS_CERTIFICATE_BUNDLE=1
lib_deps =
    https://github.com/m5stack/M5Unified
    https://github.com/m5stack/M5GFX
    https://github.com/m5stack/M5PM1
